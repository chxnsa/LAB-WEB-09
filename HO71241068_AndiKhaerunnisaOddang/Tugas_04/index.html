<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNO Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .uno-title {
            text-shadow: 
                -3px -3px 0 #333,
                3px -3px 0 #333,
                -3px 3px 0 #333,
                3px 3px 0 #333,
                -5px -5px 0 #ffd700,
                5px -5px 0 #ffd700,
                -5px 5px 0 #ffd700,
                5px 5px 0 #ffd700;
            letter-spacing: 5px;
        }

        .card {
            width: 70px;
            height: 105px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            border: 3px solid transparent;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .card.back {
            background-image: url('assets/cards/back.png');
            border-color: #4a4a4a;
        }

        .card.red { border-color: #8b0000; }
        .card.blue { border-color: #004499; }
        .card.green { border-color: #116611; }
        .card.yellow { border-color: #ccaa00; }
        .card.wild { border-color: #333; }

        .card:hover:not(.disabled):not(.back) {
            transform: translateY(-10px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
        }

        .card.selected {
            transform: translateY(-15px) scale(1.05);
            box-shadow: 0 10px 25px rgba(255, 215, 0, 0.6);
            border-color: #ffd700 !important;
            border-width: 4px;
        }

        .card.disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .color-btn.selected {
            border-color: #ffd700;
            border-width: 6px;
            transform: scale(1.15);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
        }

        .deck-pile {
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .deck-pile:hover:not(.disabled) {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        .deck-pile.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .discard-pile .card {
            width: 100px;
            height: 150px;
        }

        @media (max-width: 768px) {
            .card {
                width: 55px;
                height: 85px;
            }
        }

        @keyframes pulse-uno {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .animate-pulse-uno {
            animation: pulse-uno 1.5s infinite;
        }
    </style>
</head>
<body class="bg-white min-h-screen flex justify-center items-center p-5">
    <div class="w-full max-w-7xl">
      
        <div class="text-center mb-8">
            <div class="text-7xl font-bold text-red uno-title">UNO</div>
        </div>

        <div class="flex gap-5">
          
            <div class="flex-1 bg-white rounded-3xl p-10 shadow-2xl">
            
                <div class="flex items-center gap-5 mb-10">
                    <div class="w-20 h-20 rounded-full bg-gray-300 flex items-center justify-center text-4xl border-4 border-gray-600 flex-shrink-0">🤖</div>
                    <div class="flex-1 bg-gray-100 rounded-2xl p-5">
                        <div class="text-center font-bold text-gray-600 mb-2">
                            BOT - <span id="botCardCount">7</span> Kartu
                        </div>
                        <div class="flex flex-wrap gap-2 justify-center" id="botHand"></div>
                    </div>
                </div>

                <div id="turnIndicator" class="text-center text-xl font-bold p-3 rounded-xl mb-8 bg-green-100 border-2 border-green-500 text-green-700">
                    GILIRAN ANDA
                </div>

                <div class="flex justify-center items-center gap-20 my-12">
                    <div class="deck-pile w-24 h-36 bg-gradient-to-br from-red-500 to-red-900 border-4 border-gray-700 rounded-xl flex flex-col items-center justify-center cursor-pointer" id="deckPile" onclick="drawCard()">
                        <div class="text-3xl font-bold text-yellow-300" id="deckCount">94</div>
                        <div class="text-sm text-yellow-300 font-bold">DECK</div>
                    </div>
                    <div class="discard-pile w-24 h-36 flex items-center justify-center bg-gray-100 rounded-xl border-2 border-dashed border-gray-300" id="discardPile"></div>
                </div>

                <div class="hidden flex-wrap justify-center gap-4 my-5 p-5 bg-gray-100 rounded-xl border-2 border-gray-300" id="colorPicker">
                    <div class="w-full text-center font-bold text-gray-700 mb-2">Pilih Warna:</div>
                    <div class="color-btn w-16 h-16 rounded-full border-4 border-gray-600 cursor-pointer bg-red-600 hover:scale-110 transition-transform" onclick="selectColor('red')"></div>
                    <div class="color-btn w-16 h-16 rounded-full border-4 border-gray-600 cursor-pointer bg-blue-600 hover:scale-110 transition-transform" onclick="selectColor('blue')"></div>
                    <div class="color-btn w-16 h-16 rounded-full border-4 border-gray-600 cursor-pointer bg-green-600 hover:scale-110 transition-transform" onclick="selectColor('green')"></div>
                    <div class="color-btn w-16 h-16 rounded-full border-4 border-gray-600 cursor-pointer bg-yellow-400 hover:scale-110 transition-transform" onclick="selectColor('yellow')"></div>
                </div>

                <div class="flex items-center gap-5 mb-10">
                    <div class="w-20 h-20 rounded-full bg-gray-300 flex items-center justify-center text-4xl border-4 border-gray-600 flex-shrink-0">👤</div>
                    <div class="flex-1 bg-gray-100 rounded-2xl p-5">
                        <div class="text-center font-bold text-gray-600 mb-2">
                            ANDA - <span id="playerCardCount">7</span> Kartu
                        </div>
                        <div class="flex flex-wrap gap-2 justify-center" id="playerHand"></div>
                    </div>
                </div>

                <div class="flex gap-3 justify-center flex-wrap mb-8">
                    <button class="px-8 py-3 bg-green-500 text-white font-bold rounded-lg hover:bg-green-600 transition-all disabled:opacity-50 disabled:cursor-not-allowed" id="playBtn" onclick="playSelectedCard()" disabled>
                        Mainkan Kartu
                    </button>
                    <button class="px-8 py-3 bg-gray-500 text-white font-bold rounded-lg hover:bg-gray-600 transition-all hidden" id="skipTurnBtn" onclick="skipTurn()">
                        Lewati Giliran
                    </button>
                    <button class="px-8 py-3 bg-yellow-400 text-gray-800 font-bold text-lg rounded-lg hover:scale-105 transition-all disabled:opacity-50 disabled:cursor-not-allowed animate-pulse-uno" id="unoBtn" onclick="callUNO()" disabled>
                        UNO!
                    </button>
                    <button class="px-8 py-3 bg-red-500 text-white font-bold rounded-lg hover:bg-red-600 transition-all disabled:opacity-50 disabled:cursor-not-allowed" id="callBotUnoBtn" onclick="callBotUNO()" disabled>
                        Panggil UNO Lawan
                    </button>
                </div>
            </div>

            <div class="w-80 flex flex-col gap-5">
                <div class="bg-white rounded-3xl p-6 shadow-2xl">
                    <div class="font-bold text-xl mb-4 text-gray-800">Status Permainan</div>
                    <div class="flex justify-between mb-3 p-3 bg-gray-100 rounded-lg">
                        <span class="font-bold text-gray-700">Saldo:</span>
                        <span class="font-bold text-red-600 text-lg" id="balance">$5000</span>
                    </div>
                    <div class="flex justify-between mb-3 p-3 bg-gray-100 rounded-lg">
                        <span class="font-bold text-gray-700">Taruhan:</span>
                        <span class="font-bold text-red-600 text-lg" id="bet">-</span>
                    </div>
                    <div class="flex justify-between p-3 bg-gray-100 rounded-lg">
                        <span class="font-bold text-gray-700">Arah:</span>
                        <span class="font-bold text-red-600 text-lg" id="direction">➡️</span>
                    </div>
                </div>
                <div class="bg-white rounded-3xl p-6 shadow-2xl flex-1">
                    <div class="font-bold text-xl mb-4 text-gray-800">Log Permainan</div>
                    <div class="bg-gray-100 h-96 overflow-y-auto rounded-lg border-2 border-gray-300 p-3 text-sm" id="gameLog"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center z-50 active" id="bettingModal">
        <div class="bg-white border-4 border-red-600 rounded-3xl p-10 text-center max-w-md shadow-2xl">
            <div class="text-5xl font-bold text-red-600 mb-5">UNO</div>
            <div class="text-xl mb-5 text-gray-700">Masukkan Taruhan Anda</div>
            <div class="text-2xl text-red-600 mb-5">
                Saldo: $<span id="modalBalance">5000</span>
            </div>
            <input type="number" id="betInput" class="w-full p-4 border-2 border-gray-300 rounded-lg text-lg mb-4 focus:outline-none focus:border-red-600" placeholder="Minimum $100" min="100">
            <div class="text-red-600 font-bold mb-5 min-h-5" id="betError"></div>
            <button class="w-full px-8 py-3 bg-green-500 text-white font-bold rounded-lg hover:bg-green-600 transition-all" onclick="startGame()">Mulai Permainan</button>
        </div>
    </div>

    <div class="fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center z-50 hidden" id="gameOverModal">
        <div class="bg-white border-4 border-red-600 rounded-3xl p-10 text-center max-w-md shadow-2xl">
            <div class="text-5xl font-bold text-red-600 mb-5" id="gameOverTitle">GAME OVER</div>
            <div class="text-xl text-gray-700 mb-8" id="gameOverText"></div>
            <button class="w-full px-8 py-3 bg-green-500 text-white font-bold rounded-lg hover:bg-green-600 transition-all" onclick="resetGame()">Main Lagi</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
